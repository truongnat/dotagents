name: Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skills, Memory, and Tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Doctor & Tests
        run: |
          chmod +x .agents/scripts/*.sh .agents/scripts/*.py
          ./.agents/scripts/doctor.sh
          ./.agents/scripts/test-init-project.sh
